version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai_tutor_db
    environment:
      POSTGRES_DB: ai_tutor
      POSTGRES_USER: tutor_admin
      POSTGRES_PASSWORD: dev_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor_admin -d ai_tutor"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ai_tutor_cache
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # pgAdmin (Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai_tutor_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aitutor.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Backend API (when ready)
  # api:
  #   build:
  #     context: ../../backend/tutor_service
  #     dockerfile: Dockerfile
  #   container_name: ai_tutor_api
  #   environment:
  #     DATABASE_URL: postgresql://tutor_admin:dev_password_change_in_prod@postgres:5432/ai_tutor
  #     REDIS_URL: redis://redis:6379
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #     PINECONE_API_KEY: ${PINECONE_API_KEY}
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: ai_tutor_network
